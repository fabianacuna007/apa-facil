# Servidor de APA Fácil en Render (paso 11.1). En Render: New > Blueprint > este repositorio.
# Usa el Dockerfile de la raíz. Cada commit en main se despliega solo.
services:
  - type: web
    name: apa-facil-api
    runtime: docker
    plan: free              # 512 MB de memoria; se duerme tras 15 minutos sin uso
    region: frankfurt       # en la UE (RGPD)
    branch: main
    healthCheckPath: /salud
    autoDeployTrigger: commit
    envVars:
      # Dirección de la web en Vercel (p. ej. https://apa-facil.vercel.app). Render la pide al crear el servicio.
      - key: APA_ORIGENES
        sync: false
      # Con 512 MB, un documento cada vez.
      - key: APA_SIMULTANEOS
        value: "1"
      # Proxies delante del servidor (ver servidor/limites.py). Medido con APA_DIAGNOSTICO_IP
      # (2026-10-20): X-Forwarded-For llega como «[inventadas], estudiante, Cloudflare, Render».
      - key: APA_PROXIES
        value: "3"
      # /limite enseña las cabeceras de IP de quien pregunta. Solo para volver a medir.
      - key: APA_DIAGNOSTICO_IP
        value: "0"
